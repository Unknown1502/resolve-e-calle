[project]
name = "resolve-e"
version = "0.1.0"
description = "Autonomous exception-resolution agent that uses phone calls as its execution layer, powered by CALL-E."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  # The official CALL-E SDK. Default transport for live calls.
  "calle-ai>=0.7",
  "redis>=5.2",
  "jsonschema>=4.23",
  "structlog>=24.4",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
resolve-e = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"app.db.migrations" = ["*.mako"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
  "live: hits the real CALL-E API and places a real phone call (deselected by default)",
  "integration: requires PostgreSQL from docker compose",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "RET", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's Depends()/Query()/Body() in defaults is the framework's
# documented idiom, not a mutable-default bug.
"backend/app/api/routes.py" = ["B008"]
"backend/tests/**" = ["S105", "S106", "E501"]
# Alembic autogenerates these; reformatting them by hand invites a
# hand-edit that no longer matches what the models produce.
"backend/app/db/migrations/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
